<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ইন্টারনেট নেই · নূর কুরআন</title>
<style>
  :root { --bg: #f5f7f4; --ink: #14231d; --ink2: #55665e; --ac: #0f4c3a; --on-ac: #fff; --wash: #f1e6c8; --gt: #7a5c14; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0a1511; --ink: #e7efe8; --ink2: #9db1a5; --ac: #5fb08a; --on-ac: #06130e; --wash: #332c16; --gt: #d9bc77; } }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; text-align: center; }
  main { padding: 2rem 1rem; max-width: 22rem; line-height: 1.7; }
  .mark { display: grid; place-items: center; width: 5.25rem; height: 5.25rem; margin: 0 auto 1rem; border-radius: 50%; background: var(--wash); color: var(--gt); }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { color: var(--ink2); margin: 0 0 1.25rem; }
  a, button { display: flex; align-items: center; justify-content: center; min-height: 3.25rem; width: 100%; box-sizing: border-box; margin-top: .75rem; padding: 0 1.4rem; border-radius: 999px; border: 1px solid var(--ac); font: inherit; font-weight: 600; text-decoration: none; }
  a.main { background: var(--ac); color: var(--on-ac); }
  button, a.other { background: transparent; color: var(--ac); }
  :focus-visible { outline: 2px solid var(--ac); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <span class="mark" aria-hidden="true"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l16 16M5 10a11 11 0 0 1 4-2.4M19 10a11 11 0 0 0-6.5-3M8.5 13.5a6 6 0 0 1 2-1.1M15.5 13.5a6 6 0 0 0-2.6-1.4M12 17.5h.01"/></svg></span>
  <h1>আপনি অফলাইনে আছেন</h1>
  <p>এই পাতাটি ফোনে সেভ করা নেই। সেভ করা পাতা, আমল ও তাসবিহ ইন্টারনেট ছাড়াও চলবে।</p>
  <a class="main" href="/quran/">কুরআন পড়ুন</a>
  <button type="button" onclick="location.reload()">আবার চেষ্টা</button>
  <a class="other" href="/">হোমে যান</a>
</main>
</body>
</html>
